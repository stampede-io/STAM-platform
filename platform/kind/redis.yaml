# Shared infra for the kind-local cluster, same reasoning as kafka.yaml:
# catalog's availability cache and booking's HoldMirrorService both hit
# Redis at request time (not just at startup, so the probes don't catch a
# missing Redis the way they caught the missing Kafka). One shared instance,
# mirroring compose-dev's single shared `redis` service (CLAUDE.md §4.9).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: stampede
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: stampede
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
