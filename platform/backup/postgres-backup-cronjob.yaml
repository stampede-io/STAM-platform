# STAM-59 / STAM-457: nightly pg_dump of all 5 databases, uploaded to the S3
# bucket Terraform creates (30-day expiry set on the bucket itself).
#
# No credential lives in this manifest or in any Secret: the AWS CLI picks
# up the EC2 instance role through IMDSv2 (hop limit 2 in main.tf so a pod
# can reach it), and that role may only read/write this one bucket.
#
# Apply with the two placeholders substituted from Terraform outputs:
#   BACKUP_BUCKET=$(terraform -chdir=platform/terraform output -raw backup_bucket) \
#   AWS_REGION=$(terraform -chdir=platform/terraform output -raw region) \
#   envsubst '$BACKUP_BUCKET $AWS_REGION' < platform/backup/postgres-backup-cronjob.yaml | kubectl apply -f -
# The variable list matters: a bare envsubst would also blank the script's
# own ${DATE} and ${db}.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: apps
spec:
  schedule: "0 2 * * *" # 02:00 UTC, AC1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              # Ships pg_dump 16 (matches the server); aws-cli is added below.
              image: postgres:16-alpine
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-admin-secret
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-admin-secret
                      key: POSTGRES_PASSWORD
                - name: BACKUP_BUCKET
                  value: ${BACKUP_BUCKET}
                - name: AWS_REGION
                  value: ${AWS_REGION}
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache aws-cli >/dev/null

                  DATE=$(date +%Y-%m-%d)
                  for db in identity_db catalog_db booking_db payment_db notification_db; do
                    echo "dumping $db"
                    pg_dump -h "$PGHOST" -U "$PGUSER" -d "$db" | gzip > "/tmp/${DATE}_${db}.sql.gz"
                    aws s3 cp --only-show-errors \
                      "/tmp/${DATE}_${db}.sql.gz" "s3://${BACKUP_BUCKET}/${DATE}_${db}.sql.gz"
                    echo "uploaded ${DATE}_${db}.sql.gz"
                  done
