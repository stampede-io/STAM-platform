# STAM-58 / AC1(1): only ingress-nginx can reach the gateway. The
# namespaceSelector relies on the automatic `kubernetes.io/metadata.name`
# label every namespace gets from the API server — no manual labelling
# needed on whatever ingress controller namespace this cluster uses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# Egress side of AC1(2): the gateway is the one pod allowed to fan out to
# every backend service (CLAUDE.md §14's gateway fan-out table — identity,
# catalog, booking, payment, notification), plus Redis for its own
# token-bucket rate limiting (CLAUDE.md §4.9 / §2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: identity
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: booking
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payment
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notification
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
