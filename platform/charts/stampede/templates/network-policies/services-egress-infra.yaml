# Not named directly in AC1, but required for default-deny-all egress to
# not silently break every Kafka producer/consumer and Redis-backed
# feature in the system. Kafka lives in its own `kafka` namespace
# (Strimzi, ADR-0007) so this needs a namespaceSelector rather than a
# same-namespace podSelector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-egress-kafka
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [identity, catalog, booking, payment, notification]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9092
---
# Redis: catalog's availability cache and booking's TTL hold mirror
# (CLAUDE.md §4.9 / §2). identity, payment and notification don't use it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-egress-redis
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [catalog, booking]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
# Egress side of the booking -> catalog sync hop (see catalog-ingress in
# services-ingress.yaml for the matching ingress side and why it exists).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-egress-catalog
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: booking
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
      ports:
        - protocol: TCP
          port: 8080
