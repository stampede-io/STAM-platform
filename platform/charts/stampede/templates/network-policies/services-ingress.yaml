---
# catalog is the one exception to "only gateway can reach each service":
# CLAUDE.md §2/§4 — booking -> catalog is the system's only synchronous
# service-to-service call (OpenFeign behind booking's circuit breaker,
# CircuitBreakerIT), seat validation on the booking path. Catalog's
# ingress has to allow that caller too, or the one real sync hop in the
# system breaks the moment this NetworkPolicy applies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalog
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: booking
      ports:
        - protocol: TCP
          port: 8080
