apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-gateway-health-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - curl -sf http://gateway:8080/actuator/health/readiness
