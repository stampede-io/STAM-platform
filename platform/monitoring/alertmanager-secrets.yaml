# STAM-66 / AC4: placeholder SealedSecrets for Alertmanager's email and
# Telegram receivers. These encrypt the literal string "changeme-..." --
# not real credentials, the same placeholder convention this chart
# already uses for Postgres (platform/charts/stampede/values.yaml). A
# real deploy needs its own `kubeseal --raw` run against real values;
# see platform/monitoring/README.md.
#
# Mounted into the Alertmanager pod via alertmanagerSpec.secrets in
# values.yaml, then referenced by the _file config options below so the
# plaintext secret is never inlined into Alertmanager's own config
# Secret (which this chart's values.yaml *is* committed to git).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: alertmanager-smtp
      namespace: monitoring
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: alertmanager-telegram
      namespace: monitoring
    type: Opaque
